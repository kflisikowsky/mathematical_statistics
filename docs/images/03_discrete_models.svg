<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Examples of discrete probability distributions</title>
  <desc id="desc">Three probability mass function plots compare a binomial distribution, a Poisson distribution, and a hypergeometric distribution. Each plot has an independently scaled vertical axis.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#123a63}
    .title{font-size:22px;font-weight:700}
    .subtitle{font-size:14px}
    .label{font-size:13px}
    .tick{font-size:11px;fill:#53677a}
    .grid{stroke:#dce6f1;stroke-width:1}
    .axis{stroke:#7890a5;stroke-width:1.1}
  </style>
  <rect width="960" height="390" fill="#fff"/>
  <text class="title" x="480" y="34" text-anchor="middle">Discrete models assign probability to countable outcomes</text>
  <text class="tick" x="480" y="58" text-anchor="middle">Stems show P(X = k); vertical scales are shown separately.</text>
  <g>
    <text class="subtitle" x="176" y="91" text-anchor="middle" font-weight="700">Binomial(n = 10, p = 0.4)</text>
    <line class="grid" x1="58" y1="132" x2="294" y2="132"/>
    <line class="grid" x1="58" y1="187" x2="294" y2="187"/>
    <line class="grid" x1="58" y1="242" x2="294" y2="242"/>
    <line class="axis" x1="58" y1="297" x2="294" y2="297"/>
    <line class="axis" x1="58" y1="132" x2="58" y2="297"/>
    <g class="tick" text-anchor="end">
      <text x="52" y="301">0</text><text x="52" y="246">.10</text>
      <text x="52" y="191">.20</text><text x="52" y="136">.30</text>
    </g>
    <g stroke="#2563eb" stroke-width="5" stroke-linecap="round">
      <line x1="68" y1="293" x2="68" y2="297"/><line x1="89" y1="275" x2="89" y2="297"/>
      <line x1="110" y1="231" x2="110" y2="297"/><line x1="131" y1="179" x2="131" y2="297"/>
      <line x1="152" y1="159" x2="152" y2="297"/><line x1="173" y1="187" x2="173" y2="297"/>
      <line x1="194" y1="236" x2="194" y2="297"/><line x1="215" y1="274" x2="215" y2="297"/>
      <line x1="236" y1="291" x2="236" y2="297"/><line x1="257" y1="296" x2="257" y2="297"/>
      <line x1="278" y1="297" x2="278" y2="297"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="68" y="318">0</text><text x="110" y="318">2</text><text x="152" y="318">4</text>
      <text x="194" y="318">6</text><text x="236" y="318">8</text><text x="278" y="318">10</text>
    </g>
    <text class="label" x="176" y="342" text-anchor="middle">Successes, k</text>
  </g>
  <g>
    <text class="subtitle" x="480" y="91" text-anchor="middle" font-weight="700">Poisson(λ = 4)</text>
    <line class="grid" x1="362" y1="132" x2="598" y2="132"/>
    <line class="grid" x1="362" y1="187" x2="598" y2="187"/>
    <line class="grid" x1="362" y1="242" x2="598" y2="242"/>
    <line class="axis" x1="362" y1="297" x2="598" y2="297"/>
    <line class="axis" x1="362" y1="132" x2="362" y2="297"/>
    <g class="tick" text-anchor="end">
      <text x="356" y="301">0</text><text x="356" y="246">.10</text>
      <text x="356" y="191">.20</text><text x="356" y="136">.30</text>
    </g>
    <g stroke="#087f8c" stroke-width="5" stroke-linecap="round">
      <line x1="372" y1="287" x2="372" y2="297"/><line x1="393" y1="257" x2="393" y2="297"/>
      <line x1="414" y1="216" x2="414" y2="297"/><line x1="435" y1="189" x2="435" y2="297"/>
      <line x1="456" y1="189" x2="456" y2="297"/><line x1="477" y1="211" x2="477" y2="297"/>
      <line x1="498" y1="240" x2="498" y2="297"/><line x1="519" y1="264" x2="519" y2="297"/>
      <line x1="540" y1="281" x2="540" y2="297"/><line x1="561" y1="290" x2="561" y2="297"/>
      <line x1="582" y1="294" x2="582" y2="297"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="372" y="318">0</text><text x="414" y="318">2</text><text x="456" y="318">4</text>
      <text x="498" y="318">6</text><text x="540" y="318">8</text><text x="582" y="318">10</text>
    </g>
    <text class="label" x="480" y="342" text-anchor="middle">Events in interval, k</text>
  </g>
  <g>
    <text class="subtitle" x="784" y="91" text-anchor="middle" font-weight="700">Hypergeometric</text>
    <text class="tick" x="784" y="109" text-anchor="middle">N = 10 · K = 4 · n = 5</text>
    <line class="grid" x1="666" y1="132" x2="902" y2="132"/>
    <line class="grid" x1="666" y1="187" x2="902" y2="187"/>
    <line class="grid" x1="666" y1="242" x2="902" y2="242"/>
    <line class="axis" x1="666" y1="297" x2="902" y2="297"/>
    <line class="axis" x1="666" y1="132" x2="666" y2="297"/>
    <g class="tick" text-anchor="end">
      <text x="660" y="301">0</text><text x="660" y="246">.2</text>
      <text x="660" y="191">.4</text><text x="660" y="136">.6</text>
    </g>
    <g stroke="#c65d21" stroke-width="5" stroke-linecap="round">
      <line x1="676" y1="291" x2="676" y2="297"/><line x1="718" y1="232" x2="718" y2="297"/>
      <line x1="760" y1="166" x2="760" y2="297"/><line x1="802" y1="232" x2="802" y2="297"/>
      <line x1="844" y1="284" x2="844" y2="297"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="676" y="318">0</text><text x="718" y="318">1</text><text x="760" y="318">2</text>
      <text x="802" y="318">3</text><text x="844" y="318">4</text>
    </g>
    <text class="label" x="784" y="342" text-anchor="middle">Successes in sample, k</text>
  </g>
  <text class="tick" x="480" y="374" text-anchor="middle">N = population size · K = population successes · n = sample size</text>
</svg>
